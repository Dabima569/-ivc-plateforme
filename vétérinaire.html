<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace vétérinaire – Ivoire Vet Consulting</title>
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#12261c;--mut:#617268;--line:#e4eae6;--g:#0e9f5a;--gd:#0a7a45;--mint:#e6f7ee;--peach:#fdebe3;--pk:#c2410c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1712;--card:#15241c;--ink:#e8f2ec;--mut:#9db1a5;--line:#25392e;--mint:#1b3a2c;--peach:#3b2418}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.side{position:fixed;inset:12px auto 12px 12px;width:262px;background:var(--card);border-radius:18px;padding:18px 12px;overflow:auto;z-index:30;transition:transform .2s;box-shadow:0 2px 14px #0000000d}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;padding:2px 8px 12px}.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.sec{font-size:12px;letter-spacing:.8px;color:var(--mut);margin:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:none;text-align:left;padding:11px 12px;border-radius:11px;font-size:16px;color:var(--mut);margin:2px 0}
.nav button:hover{background:var(--mint)}.nav button.on{background:var(--mint);border-color:#0e9f5a55;color:var(--gd);font-weight:700}
.nav i{margin-left:auto;font-style:normal;font-size:12px;background:var(--bg);border-radius:8px;padding:2px 8px;color:var(--ink)}
.sup{background:var(--mint);border-radius:12px;padding:13px;margin-top:16px;font-size:14px}.sup b{display:block}
.main{margin-left:288px;padding:12px 14px 20px 6px;min-width:0}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:14px;position:relative}
.burger{display:none;border:0;background:none;font-size:26px}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;text-align:left;font-size:14px;line-height:1.2}
.av{width:46px;height:46px;border-radius:50%;background:var(--mint) center/cover no-repeat;display:grid;place-items:center;font-size:22px;border:2px dashed var(--g);flex:none}.av.has{border-style:solid}
.search{flex:1;max-width:420px;margin-left:auto;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);min-width:0}
.ib{position:relative;border:1px solid var(--line);background:var(--card);border-radius:11px;width:44px;height:44px;font-size:20px}
.ib b{position:absolute;top:-6px;right:-6px;background:#e11d48;color:#fff;border-radius:50%;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center}
.pop{position:absolute;right:12px;top:66px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0003;width:300px;max-width:92vw;z-index:40;display:none;padding:6px}.pop.show{display:block}
.pop button,.pop div{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:8px;font-size:15px}.pop button:hover{background:var(--mint)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.hd h1{margin:0;font-size:28px}.hd p{margin:2px 0 0;color:var(--mut)}
.bdg{display:inline-block;background:var(--mint);color:var(--gd);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:700}
.pb,.sb,.xb{border-radius:10px;padding:9px 15px;font-weight:700;font-size:15px;border:1px solid var(--g)}.pb{background:var(--g);color:#fff}.sb{background:var(--mint);color:var(--gd)}.xb{background:var(--card);color:#b42318;border-color:#e11d4866}
.card{background:var(--card);border-radius:16px;margin-bottom:14px;min-width:0;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 18px 6px}.ph h2{margin:0;font-size:19px}
.lk{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 12px;font-size:14px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:16px 8px}.stats>div{padding:2px 18px;border-left:1px solid var(--line)}.stats>div:first-child{border:0}
.stats small{font-size:15px}.stats strong{display:block;font-size:40px;line-height:1.15}
.tgb{display:block;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;background:var(--mint);color:var(--gd);margin-top:6px}.tgb.p{background:var(--peach);color:var(--pk)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.g2>*,.g3>*{min-width:0}.g2b{grid-template-columns:1.2fr 1fr}.ag>div{flex:1 1 180px;min-width:0}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ms{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.th{width:54px;height:54px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:28px}
.ms b{display:block}.ms small{color:var(--mut);font-size:14px;display:block}
.tg{display:inline-block;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--mint);color:var(--gd);margin-top:4px}.tg.w{background:#fdf0d5;color:#9a5b08}.tg.x{background:var(--peach);color:var(--pk)}
.ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.qk{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:0 16px 10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px;text-align:left}.qk:hover{border-color:var(--g)}.qk b{display:block;font-size:16px}.qk small{color:var(--mut);font-size:13px}.qk span{font-size:24px}
.ag{flex-wrap:wrap;margin:8px 18px 12px;border:1px solid var(--line);border-left:4px solid var(--g);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.ag b{display:block;font-size:17px}.ag small{color:var(--mut)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 16px}.rg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.rg b{font-size:20px;display:block}
.ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ring:after{content:"";width:32px;height:32px;border-radius:50%;background:var(--card)}
.sw{position:relative;width:54px;height:30px;border-radius:20px;background:#aab6ae;border:0;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:27px}
.goal{margin:6px 16px 16px;border-radius:14px;padding:16px;background:linear-gradient(135deg,#0e9f5a,#0a6b3c);color:#fff}.goal b{font-size:18px}.bar{height:9px;background:#ffffff44;border-radius:6px;margin:10px 0}.bar i{display:block;height:100%;background:#fff;border-radius:6px}.goal button{border:0;border-radius:20px;padding:8px 14px;font-weight:700;background:#fff;color:var(--gd)}
.tl{padding:6px 18px 16px;display:grid;gap:12px}.tl div{display:flex;gap:10px;align-items:center;font-size:15px}.tl .d{width:10px;height:10px;border-radius:50%;background:var(--g);flex:none}.tl small{color:var(--mut);display:block;font-size:13px}
.chart{padding:4px 14px 14px}.chart svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-top:1px solid var(--line);font-size:15px;white-space:nowrap}th{font-size:13px;color:var(--mut);border:0}.sx{overflow:auto}
.ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:14px;padding:4px 6px}
.mb{position:fixed;inset:0;background:#0a1d1288;display:none;align-items:center;justify-content:center;padding:14px;z-index:60}.mb.show{display:flex}
.md{background:var(--card);border-radius:16px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px}.md h3{margin:0 0 12px;font-size:21px}
.fd{display:grid;gap:6px;margin:12px 0;font-weight:600;font-size:15px}.fd input,.fd select,.fd textarea{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--bg)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.sl{display:grid;grid-template-columns:90px repeat(2,1fr);gap:8px;padding:6px 18px 18px;align-items:center}.sl button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px}.sl button.on{background:var(--g);color:#fff;border-color:var(--g)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f3a28;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:90;max-width:92vw}
@media(max-width:1180px){.g2,.g3,.g2b{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;row-gap:16px}.stats>div:nth-child(3){border-left:0}}
@media(max-width:560px){.main{padding:8px}.top{padding:8px;gap:8px}.stats{padding:12px 4px;grid-template-columns:1fr 1fr}.stats>div{padding:2px 12px}.stats strong{font-size:32px}.ms{padding:12px}.ph{padding:14px 14px 4px}.ph h2{font-size:17px}.rings{grid-template-columns:1fr 1fr;padding:8px 12px 14px}.ag{margin:8px 12px 10px}.hd h1{font-size:22px}.ib{width:40px;height:40px}.me{padding:4px}.sl{grid-template-columns:48px 1fr 1fr;padding:6px 12px 14px}.ms .ac button{flex:1}}
@media(max-width:860px){.side{transform:translateX(-110%);inset:0 auto 0 0;border-radius:0}.side.open{transform:none}.main{margin-left:0;padding:10px}.burger{display:block}.me .n{display:none}.ms{grid-template-columns:48px 1fr}.ms .ac{grid-column:1/-1;justify-content:flex-start}.hd h1{font-size:24px}.search{display:none}.ib{margin-left:auto}.ib~.ib{margin-left:0}}
</style></head><body>
<aside class="side" id="side">
<div class="brand"><span style="font-size:30px">🐾</span><div>IVC<small>Espace vétérinaire</small></div></div>
<nav class="nav" id="nav">
<div class="sec">MON ACTIVITÉ</div>
<button data-v="dash" class="on">🏠 Tableau de bord</button><button data-v="missions">📋 Mes missions <i id="nm"></i></button><button data-v="consult">🎥 Mes consultations <i id="ncs"></i></button><button data-v="agenda">🗓️ Agenda &amp; disponibilités</button>

<div class="sup"><b>Support vétérinaire IVC</b>support@ivc.ci<br>+225 07 07 07 07 07</div>
</aside>
<div class="main">
<header class="top">
<button class="burger" id="bg" aria-label="Menu">☰</button>
<button class="me" id="me"><span class="av" id="av">📷</span><span class="n"><b id="vn">Dr Awa N’Guessan</b><br>Vétérinaire agréée ⌄</span></button>

<div id="app"></div>
</div>
<div class="mb" id="mb"><div class="md" id="md"></div></div><div class="toast" id="toast" role="status"></div>
<script>
var $=function(s){return document.querySelector(s)},app=$("#app"),cur="dash",qv="",avail=true,goal=60;
var VN="Dr Awa N’Guessan";try{VN=localStorage.getItem("ivc_vet_name")||VN}catch(x){}
var TODAY=new Date(2026,10,15);
var M=[["M1","Visite d’élevage – Bovins","Éleveur : Kouadio A.","Agnibilékrou (élevage bovin)","12/11/2026","14:00","Intervention terrain","🐄","w"],["M2","Consultation – Chien (Rex)","Client : Koffi M.","Abidjan – Cocody","12/11/2026","16:30","Consultation vidéo","🐕","w"],["M3","Problème sanitaire – Volailles","Éleveur : Bamba S.","Anyama (élevage avicole)","13/11/2026","09:00","Diagnostic & conseils","🐔","w"]];
var C=[["VID-025","Rex · Chien","Marie Kouassi","15 nov. 2026 · 15:30","Vidéo"],["RDV-021","Bovin #BV-024","Adama Koné","16 nov. 2026 · 09:00","Terrain"],["VID-026","Mimi · Chat","Pauline Yao","17 nov. 2026 · 11:00","Vidéo"],["RDV-022","Lot AV-18 · Volailles","Ferme des Lagunes","18 nov. 2026 · 08:30","Terrain"],["VID-027","Rex · Chien","Koffi M.","19 nov. 2026 · 16:00","Vidéo"]];
var P=[["Rex","Chien","Marie Kouassi","12 nov. 2026"],["Bovin #BV-024","Bovin","Adama Koné","11 nov. 2026"],["Mimi","Chat","Pauline Yao","08 nov. 2026"],["Lot AV-18","Volailles","Ferme des Lagunes","07 nov. 2026"]];
var SP=[["Chiens","🐕",14,"#0e9f5a"],["Bovins","🐄",15,"#1682df"],["Volailles","🐔",11,"#f59a22"],["Chats","🐈",6,"#6665d8"]];
var AN=[["AN-0245","Bovin #BV-024","Parasitologie","Résultat disponible"],["AN-0246","Lot AV-18","Bactériologie","À valider"]];
var DOC=[["Rapport – Visite d’élevage Anyama","10 nov. 2026"],["Compte rendu – Rex","08 nov. 2026"]];
var MSG=[["Support IVC","Bienvenue dans votre espace vétérinaire.",1],["Administration IVC","Mission IVC-104 attribuée.",1]];
var CM=[["Juin",28],["Juil.",34],["Août",31],["Sept.",40],["Oct.",45],["Nov.",18]];
var ACT=[["Mission attribuée : Visite d’élevage – Bovins","Il y a 10 min"],["Rapport validé : Analyse #AN-0245","Il y a 45 min"],["Consultation terminée : Chat – Minou","Il y a 2 h"]];
var SL={};["Lun","Mar","Mer","Jeu","Ven","Sam"].forEach(function(d){SL[d]=[1,d!=="Sam"?1:0]});
var ST={w:"À répondre",a:"Acceptée",x:"Refusée"};
function $$(s){return document.querySelectorAll(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600)}
function modal(h){$("#md").innerHTML=h;$("#mb").classList.add("show")}function close(){$("#mb").classList.remove("show")}
function pend(){return M.filter(function(m){return m[8]==="w"})}
function log(t){ACT.unshift([t,"À l’instant"]);ACT.length=Math.min(ACT.length,6)}
function tg(s){return'<span class="tg '+(s==="w"?"w":s==="x"?"x":"")+'">'+ST[s]+'</span>'}
function counts(){var p=pend().length;$("#nm").textContent=p;$("#nm").style.display=p?"":"none";$("#ncs").textContent=C.length;var u=MSG.filter(function(m){return m[2]}).length;$("#nmsg").textContent=u;$("#nmsg").style.display=u?"":"none";$("#nc").textContent=p+u;$("#nc").style.display=p+u?"":"none"}
function msRow(m){return'<div class="ms"><div class="th">'+m[7]+'</div><div><b>'+esc(m[1])+'</b><small>'+esc(m[2])+'</small><small>📍 '+esc(m[3])+'</small><small>📅 '+m[4]+' &nbsp;🕒 '+m[5]+'</small><span class="tg '+(m[6].indexOf("vidéo")>-1?"":"w")+'">'+m[6]+'</span></div><div class="ac">'+(m[8]==="w"?'<button class="pb" data-a="acc" data-id="'+m[0]+'">✓ Accepter</button><button class="xb" data-a="ref" data-id="'+m[0]+'">✕ Refuser</button>':tg(m[8]))+'</div></div>'}
function dash(){var p=pend(),tot=SP.reduce(function(s,x){return s+x[2]},0),mx=60,h="",bc=["#10b981","#14b8a6","#38bdf8","#0ea5e9","#3b82f6","#6366f1"],cn=CM[CM.length-1][1];
CM.forEach(function(c,i){var w=36,x=60+i*80,bh=c[1]/mx*150;h+='<rect x="'+x+'" y="'+(180-bh)+'" width="'+w+'" height="'+bh+'" rx="6" fill="'+bc[i]+'"><title>'+c[0]+" : "+c[1]+' consultations</title></rect><text x="'+(x+w/2)+'" y="204" text-anchor="middle" font-size="13" fill="currentColor" opacity=".7">'+c[0]+'</text>'});
[0,20,40,60].forEach(function(v){var y=180-v/mx*150;h+='<line x1="40" x2="540" y1="'+y+'" y2="'+y+'" stroke="currentColor" opacity=".1"/><text x="34" y="'+(y+4)+'" text-anchor="end" font-size="13" fill="currentColor" opacity=".7">'+v+'</text>'});
app.innerHTML='<div class="hd"><div><h1>Bonjour, '+esc(VN)+'</h1><p><span class="bdg">🛡️ Profil agréé · Démo</span> &nbsp; '+TODAY.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</p></div><button class="pb" data-a="export">⬆ Exporter</button></div>'
+'<div class="card stats"><div><small>Missions à traiter</small><strong>'+p.length+'</strong><span class="tgb">À accepter ou refuser</span></div><div><small>Consultations prévues</small><strong>'+C.length+'</strong><span class="tgb">Cette semaine</span></div><div><small>Patients suivis</small><strong>'+tot+'</strong><span class="tgb">Dossiers actifs</span></div><div><small>Analyses à consulter</small><strong>'+AN.length+'</strong><span class="tgb p">Résultats à lire</span></div></div>'
+'<div class="g2"><div class="card"><div class="ph"><h2>Nouvelles missions</h2><button class="lk" data-v="missions">Voir toutes les missions →</button></div>'+(p.slice(0,3).map(msRow).join("")||'<div class="ms" style="display:block">Aucune nouvelle mission.</div>')+'</div>'
+'<div class="card"><div class="ph"><h2>Accès rapides</h2></div><button class="qk" data-v="agenda"><span>🗓️</span><div><b>Mon agenda</b><small>Voir mes rendez-vous et disponibilités</small></div></button><button class="qk" data-v="consult"><span>🎥</span><div><b>Mes consultations</b><small>Démarrer ou rejoindre une consultation</small></div></button><button class="qk" data-v="patients"><span>🐾</span><div><b>Mes patients</b><small>Consulter et mettre à jour les dossiers</small></div></button><button class="qk" data-a="newrep"><span>📝</span><div><b>Mes rapports</b><small>Rédiger comptes rendus et bilans</small></div></button></div></div>'
+'<div class="g2 g2b"><div class="card"><div class="ph"><h2>Prochain rendez-vous</h2><button class="lk" data-v="consult">Voir tout</button></div>'+C.slice(0,2).map(agc).join("")+'</div>'
+'<div class="card"><div class="ph"><h2>Statistiques des consultations</h2><button class="lk" data-v="consult">Voir tout</button></div><div class="chart"><svg id="bc" role="img" aria-label="Consultations par mois"></svg></div></div></div>'
+'<div class="g3"><div class="card"><div class="ph"><h2>Patients par type</h2><button class="lk" data-v="patients">Voir tout</button></div><div class="rings">'+SP.map(function(s){var pc=Math.round(s[2]/tot*100);return'<div class="rg"><div>'+s[1]+' '+s[0]+'<b>'+s[2]+'</b>'+pc+'%</div><div class="ring" style="background:conic-gradient('+s[3]+' '+pc+'%,#d9e2dc 0)"></div></div>'}).join("")+'</div></div>'
+'<div class="card"><div class="ph"><h2>Disponibilité</h2></div><div class="li" style="border:0;padding:8px 18px"><div><b style="font-size:18px;color:var(--gd)">'+(avail?"Disponible":"Indisponible")+'</b><small style="display:block;color:var(--mut)">Vous pouvez recevoir de nouvelles missions et consultations.</small></div><button class="sw'+(avail?" on":"")+'" data-a="avail" aria-label="Changer ma disponibilité"></button></div><div class="goal"><b>Objectif de '+goal+' consultations en novembre</b><div class="bar"><i style="width:'+Math.min(100,Math.round(cn/goal*100))+'%"></i></div>'+cn+' / '+goal+' réalisées<br><br><button data-a="goal">Ajuster mes objectifs</button></div></div>'

if(mode==='signup'){IVC.db.auth.signUp({email:f.e.value,password:f.p.value,options:{data:{requested_role:signupRole,full_name:f.n.value}}}).then(function(r){if(r.error){m.textContent=r.error.message;return}IVC.db.auth.signOut();m.style.color='#0f6b3a';m.textContent='Compte créé. Il sera actif après agrément par l’administration IVC. Si un e-mail de confirmation est demandé, confirmez-le d’abord.'});return}
IVC.db.auth.signInWithPassword({email:f.e.value,password:f.p.value}).then(function(r){if(r.error){m.textContent='E-mail ou mot de passe incorrect.';return}check().then(function(p){if(p)enter(p)})})};
IVC.logout=function(){if(IVC._room)IVC._room.disconnect();IVC.db.auth.signOut().then(function(){location.reload()})};
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-a="logout"]');if(t){e.preventDefault();e.stopPropagation();IVC.logout()}},true);
};
</script>

<script id="ivc-vet-supabase">
IVC.gate('Espace vétérinaire IVC',function(p){return p.role!=='veterinaire'?'Ce compte n’a pas accès à cet espace.':p.is_suspended?'Compte suspendu.':!p.is_verified?'Compte en attente d’agrément par IVC.':''},function(p){
var ME=p.id;VN=p.full_name||VN;$('#vn').textContent=VN;avail=!!p.is_available;window.CMAP={};
var SM={pending:'w',accepted:'a',in_progress:'a',completed:'a',refused:'x'};
var IC={chien:'🐕',chat:'🐈',bovin:'🐄',volaille:'🐔',ovin:'🐐',caprin:'🐐'};
function fmt(s){var d=new Date(s);return{d:d.toLocaleDateString('fr-FR'),t:d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}}
function load(){Promise.all([IVC.db.from('requests').select('*').eq('assigned_professional_id',ME).order('created_at',{ascending:false}),IVC.db.rpc('ivc_get_assigned_request_contacts')]).then(function(rs){
var r=rs[0];if(r.error){toast('Erreur : '+r.error.message);return}
var who={};((rs[1].data)||[]).forEach(function(x){who[x.request_id]=x.owner_name});
var rows=(r.data||[]).filter(function(q){return SM[q.status]});
M=rows.map(function(q){var f=fmt(q.proposed_at||q.created_at);return[q.id,q.subject,'Client : '+(who[q.id]||'Client IVC'),q.animal_name||q.animal_type||'—',f.d,f.t,q.consultation_mode==='video'?'Consultation vidéo':'Intervention terrain',IC[(q.animal_type||'').toLowerCase()]||'🐾',SM[q.status]]});
window.CMAP={};
C=rows.filter(function(q){return q.status==='accepted'||q.status==='in_progress'}).map(function(q){var f=fmt(q.confirmed_at||q.created_at),k=q.id.slice(0,8).toUpperCase();CMAP[k]=q.id;return[k,q.subject,who[q.id]||'Client IVC',f.d+' · '+f.t,q.consultation_mode==='video'?'Vidéo':'Terrain']});
view()})}
var _reply=window.reply;
window.reply=function(m,s){var ok=function(r){if(r.error){toast('Erreur : '+r.error.message);return}_reply(m,s)};
if(m[6]==='Consultation vidéo')IVC.db.rpc('ivc_respond_to_video_request',{p_request_id:m[0],p_response:s==='a'?'accepted':'refused'}).then(ok);
else IVC.db.rpc('ivc_set_request_status',{p_request_id:m[0],p_status:s==='a'?'accepted':'refused'}).then(ok)};
var _close=window.close;window.close=function(){if(IVC._room){IVC._room.disconnect();IVC._room=null}_close()};
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-a="avail"]');if(!t)return;e.preventDefault();e.stopPropagation();
IVC.db.rpc('ivc_set_veterinarian_availability',{p_is_available:!avail}).then(function(r){if(r.error){toast('Erreur : '+r.error.message);return}avail=!avail;toast(avail?'Vous êtes disponible':'Vous êtes indisponible');view()})},true);
IVC.db.channel('vet-'+ME).on('postgres_changes',{event:'*',schema:'public',table:'requests',filter:'assigned_professional_id=eq.'+ME},load).subscribe();
setInterval(load,15000);load();
},'veterinaire');
</script>
