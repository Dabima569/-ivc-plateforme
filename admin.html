o.innerHTML='<form style="background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;font:15px system-ui,sans-serif;color:#14261c"><h2 style="margin:0;color:#0f6b3a">'+label+'</h2><input name="e" type="email" placeholder="E-mail" required autocomplete="username" style="'+st+'"><input name="p" type="password" placeholder="Mot de passe" required autocomplete="current-password" style="'+st+'">'+(signupRole?'<input name="n" placeholder="Nom complet" autocomplete="name" style="'+st+';display:none">':'')+'<button class="go" style="padding:10px;border:0;border-radius:10px;background:#0f6b3a;color:#fff;font:inherit;font-weight:700;cursor:pointer">Se connecter</button>'+(signupRole?'<button type="button" class="sg" style="background:none;border:0;color:#0f6b3a;font:inherit;font-weight:700;cursor:pointer;text-align:left;padding:0">Pas de compte ? Créer un compte vétérinaire</button>':'')+'<p class="m" style="margin:0;color:#b42318;font-size:13px"></p></form>';
document.body.appendChild(o);
var f=o.firstChild,m=f.querySelector('.m');
function check(){return IVC.db.auth.getUser().then(function(x){var u=x.data&&x.data.user;if(!u)return null;
return IVC.db.from('profiles').select('*').eq('id',u.id).single().then(function(r){var p=r.data,e=!p?'Profil introuvable.':test(p);
if(e){IVC.db.auth.signOut();m.textContent=e;return null}return p})})}
function enter(p){o.style.display='none';ready(p)}
IVC.db.auth.getSession().then(function(s){if(!s.data.session)return;check().then(function(p){if(p)enter(p)})});
var mode='login',sg=f.querySelector('.sg');
if(sg)sg.onclick=function(){mode=mode==='login'?'signup':'login';var s=mode==='signup';f.n.style.display=s?'':'none';f.n.required=s;f.querySelector('.go').textContent=s?'Créer mon compte':'Se connecter';sg.textContent=s?'J’ai déjà un compte':'Pas de compte ? Créer un compte vétérinaire';m.textContent='';m.style.color='#b42318'};
f.onsubmit=function(e){e.preventDefault();m.textContent='';m.style.color='#b42318';
if(mode==='signup'){IVC.db.auth.signUp({email:f.e.value,password:f.p.value,options:{data:{requested_role:signupRole,full_name:f.n.value}}}).then(function(r){if(r.error){m.textContent=r.error.message;return}IVC.db.auth.signOut();m.style.color='#0f6b3a';m.textContent='Compte créé. Il sera actif après agrément par l’administration IVC. Si un e-mail de confirmation est demandé, confirmez-le d’abord.'});return}
IVC.db.auth.signInWithPassword({email:f.e.value,password:f.p.value}).then(function(r){if(r.error){m.textContent='E-mail ou mot de passe incorrect.';return}check().then(function(p){if(p)enter(p)})})};
IVC.logout=function(){if(IVC._room)IVC._room.disconnect();IVC.db.auth.signOut().then(function(){location.reload()})};
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-a="logout"]');if(t){e.preventDefault();e.stopPropagation();IVC.logout()}},true);
};
</script>

<script id="ivc-admin-supabase">
IVC.gate('Administration IVC',function(p){return p.role!=='admin'?'Ce compte n’a pas accès à cet espace.':p.is_suspended?'Compte suspendu.':''},function(p){
ST.p='Attribuée';
var GRP=function(u){return(u.role==='veterinaire'||u.requested_role==='veterinaire')?'vets':u.role==='eleveur'?'eleveurs':'clients'};
window.VETS=[];window.UP=[];
window.vetOpts=function(){return VETS.map(function(v){return'<option value="'+v.id+'">'+esc(v.full_name||'Vétérinaire')+'</option>'}).join('')||'<option value="">Aucun vétérinaire disponible</option>'};
function hm(s){return new Date(s).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function stOf(q){return q.status==='pending'?(q.assigned_professional_id?'p':'w'):(q.status==='refused'||q.status==='cancelled')?'x':'a'}
function load(){
Promise.all([IVC.db.from('profiles').select('*').order('created_at',{ascending:false}),IVC.db.from('requests').select('*').order('created_at',{ascending:false}),IVC.db.rpc('ivc_list_veterinarians')]).then(function(rs){
var pr=rs[0],rq=rs[1];
if(pr.error||rq.error){toast('Erreur : '+((pr.error||rq.error).message));return}
var nm={};pr.data.forEach(function(u){nm[u.id]=u.full_name});
R=rq.data.map(function(q){var d=new Date(q.created_at);return[q.id,q.subject,'Client : '+(nm[q.owner_id]||'Client IVC'),q.request_type==='audit'?'audit':(q.consultation_mode==='video'?'video':'audit'),dm(d)+' – '+hm(q.created_at),stOf(q)]});
var us=pr.data.filter(function(u){return u.role!=='admin'});
UP=us;U=us.map(function(u){var g=GRP(u);return[u.full_name||'—',g,'—',u.is_suspended?'x':(g==='vets'?(u.role==='veterinaire'&&u.is_verified?'a':'w'):'a')]});
VETS=rs[2].data||[];
NT=pend().map(function(x){return'Nouvelle demande : '+x[1]});$('#nc').textContent=NT.length;view()})}
var _done=window.done;
window.done=function(r,s){var fin=function(x,t){if(x.error){toast('Erreur : '+x.error.message);return}log(s==='a'?'✅':'⛔',t+' : '+r[1]);toast(t+' : '+r[1]);close();load()};
if(s==='a'){var sel=document.getElementById('vsel'),vet=sel?sel.value:(VETS[0]&&VETS[0].id);
if(!vet){toast('Aucun vétérinaire agréé et disponible');return}
IVC.db.rpc('ivc_admin_assign_veterinary_request',{p_request_id:r[0],p_professional_id:vet}).then(function(x){fin(x,'Demande attribuée')})}
else IVC.db.rpc('ivc_set_request_status',{p_request_id:r[0],p_status:'refused'}).then(function(x){fin(x,'Demande refusée')})};
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-a="appr"]');if(!t)return;
var i=+t.dataset.i,u=UP[i];if(!u)return;e.preventDefault();e.stopPropagation();
var step=u.role==='veterinaire'?Promise.resolve({}):IVC.db.rpc('ivc_admin_set_profile_role',{p_profile_id:u.id,p_role:'veterinaire'});
step.then(function(x){if(x.error)return x;return IVC.db.rpc('ivc_verify_veterinarian',{p_professional_id:u.id,p_is_verified:true})}).then(function(x){
if(x.error){toast('Erreur : '+x.error.message);return}log('🛡️',(u.full_name||'Vétérinaire')+' approuvé');toast((u.full_name||'Vétérinaire')+' approuvé');close();load()})},true);
['requests','profiles'].forEach(function(tb){IVC.db.channel('adm-'+tb).on('postgres_changes',{event:'*',schema:'public',table:tb},load).subscribe()});
setInterval(load,20000);load();
});
</script>
